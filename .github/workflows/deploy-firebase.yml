name: Deploy Firebase (Backend & Rules)

on:
  push:
    branches:
      - main
    paths:
      - 'firebase/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'firebase.json'
  workflow_dispatch:
    inputs:
      target:
        description: 'Firebase Deployment Target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - functions
          - firestore
          - storage

jobs:
  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install & Compile Cloud Functions
        run: |
          cd firebase/functions
          npm ci
          npm run build

      - name: Deploy to Firebase
        uses: w9jds/firebase-action@v13.1.0
        with:
          args: deploy
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
